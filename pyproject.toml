description = "Add your description here"
readme = "README.md"
authors = [{ name = "hhglory", email = "hhglory@outlook.com" }]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
config = "config:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
