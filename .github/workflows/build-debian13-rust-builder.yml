name: Build Rust Builder Image (Debian13 Trixie)

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # 镜像完整名称 ghcr.io/<owner>/<repo>/<镜像名>
  # 注意: workflow 级 env 块内不能互相引用（env 上下文不可用），
  # 因此镜像名直接内联写入 IMAGE_REPO，不能用 ${{ env.IMAGE_NAME }}
  # 变体（13-rust）用 tag 的 prefix 表达，不要写进镜像名（避免非法引用 debian:13-rust:main）
  IMAGE_REPO: ${{ github.repository }}/debian

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}
          #
          # 变体前缀 13-rust- 对应 rust.Dockerfile（Debian13 + Rust stable）
          #
          flavor: |
            # 关闭内置 latest，避免生成无前缀的 :latest 标签
            latest=false
          tags: |
            # main 分支：干净标签 13-rust（去掉 -main 后缀）
            type=raw,value=13-rust,enable={{is_default_branch}}
            # 关闭分支名后缀（否则会生成 13-rust-main）
            type=ref,event=branch,enable=false
            # 推送 git tag 时保留原始 tag 名，如 13-rust-v1.2.3
            type=ref,event=tag,prefix=13-rust-
            # 语义化版本标签
            type=semver,pattern={{version}},prefix=13-rust-
            type=semver,pattern={{major}}.{{minor}},prefix=13-rust-
            type=semver,pattern={{major}},prefix=13-rust-
            # 提交短 sha，便于精确回滚
            type=sha,format=short,prefix=13-rust-
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.description=Debian13 Trixie Rust stable (rustup) builder base image

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./dockerfile/_debian/13
          file: ./dockerfile/_debian/13/rust.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
